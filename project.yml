# 鹦鹉播放器 ParrotPlayer — XcodeGen 工程配置
# 生成方式：xcodegen generate（无任何第三方依赖）
name: ParrotPlayer

options:
  bundleIdPrefix: com.parrot
  deploymentTarget:
    iOS: "16.0"

targets:
  ParrotPlayer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ParrotPlayer
        # Info.plist 由 info 段单独管理，避免重复加入编译源
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parrot.player
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: ParrotPlayer/Info.plist

schemes:
  ParrotPlayer:
    build:
      targets:
        ParrotPlayer: all
    run:
      config: Debug
